[metadata]
creation_date = "2026/10/21"
maturity = "development"
updated_date = "2026/10/22"

[rule]
author = ["lasusu"]
description = '''
Detects five successful secret-value retrievals by one identity and client in the rule interval. The threshold covers the Stratus single-secret and batch-retrieval scenarios while avoiding alerts for one or two routine reads.
'''
false_positives = ["Application startup, deployment, or secret rotation automation may retrieve several secrets. Exclude only approved workload identities after validation."]
from = "now-30m"
index = ["logs-aws.cloudtrail*"]
interval = "5m"
language = "kuery"
license = "Elastic License v2"
name = "AWS Secrets Manager High-Volume Secret Retrieval"
note = '''
## Triage and analysis

Review the actor, source IP, user agent, request parameters, and adjacent CloudTrail activity. Confirm that the activity is expected for the responsible workload before creating a narrowly scoped exception.

'''
references = ["https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.secretsmanager-retrieve-secrets/", "https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.secretsmanager-batch-retrieve-secrets/", "https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html"]
risk_score = 73
rule_id = "1c4f425c-4fc7-4bc0-9010-a1832d093743"
severity = "high"
tags = ["Domain: Cloud", "Data Source: AWS CloudTrail", "Use Case: Threat Detection"]
timestamp_override = "event.ingested"
type = "threshold"
query = '''
data_stream.dataset: "aws.cloudtrail"
  and event.provider: "secretsmanager.amazonaws.com"
  and event.action: ("GetSecretValue" or "BatchGetSecretValue")
  and event.outcome: "success"
'''

[rule.threshold]
field = ["user.id", "user_agent.original"]
value = 5


[rule.investigation_fields]
field_names = [
  "@timestamp",
  "aws.cloudtrail.user_identity.arn",
  "source.ip",
  "user_agent.original",
  "event.action",
  "aws.cloudtrail.request_parameters",
  "cloud.account.id",
  "cloud.region"
]
