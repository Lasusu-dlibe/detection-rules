[metadata]
creation_date = "2026/10/21"
maturity = "development"
updated_date = "2026/10/22"

[rule]
author = ["lasusu"]
description = '''
Detects one caller creating an IAM user and then creating a long-term access key within ten minutes. Creating a user followed by an access key is a high-risk persistence sequence; a rename is optional and must not be required for detection.
'''
false_positives = ["Approved break-glass or IAM provisioning workflows can create a user and access key. Restrict exceptions to the dedicated provisioning role and ticketed workflow."]
from = "now-30m"
index = ["logs-aws.cloudtrail*"]
interval = "5m"
language = "eql"
license = "Elastic License v2"
name = "AWS IAM User Backdoor Creation Sequence"
note = '''
## Triage and analysis

Review the actor, source IP, user agent, request parameters, and adjacent CloudTrail activity. Confirm that the activity is expected for the responsible workload before creating a narrowly scoped exception.

'''
references = ["https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-backdoor-user/", "https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateAccessKey.html"]
risk_score = 73
rule_id = "a8b92087-ff6d-4be5-bc0d-5f8dc9ba805d"
severity = "high"
tags = ["Domain: Cloud", "Data Source: AWS CloudTrail", "Use Case: Threat Detection"]
timestamp_override = "event.ingested"
type = "eql"
query = '''
sequence by aws.cloudtrail.user_identity.arn with maxspan=10m
  [any where data_stream.dataset == "aws.cloudtrail"
    and event.provider == "iam.amazonaws.com"
    and event.action == "CreateUser"
    and event.outcome == "success"]
  [any where data_stream.dataset == "aws.cloudtrail"
    and event.provider == "iam.amazonaws.com"
    and event.action == "CreateAccessKey"
    and event.outcome == "success"]
'''

[rule.investigation_fields]
field_names = [
  "@timestamp",
  "aws.cloudtrail.user_identity.arn",
  "source.ip",
  "user_agent.original",
  "event.action",
  "aws.cloudtrail.request_parameters",
  "cloud.account.id",
  "cloud.region"
]
