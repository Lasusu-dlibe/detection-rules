[metadata]
creation_date = "2026/10/21"
maturity = "development"
updated_date = "2026/10/21"

[rule]
author = ["lasusu"]
description = '''
Detects a successful EC2 instance user-data change. User data can execute commands on boot and may be used to establish execution or persistence on an existing instance.
'''
false_positives = ["Approved instance bootstrap, image maintenance, or configuration automation can update user data. Validate the target instance and change request."]
from = "now-30m"
index = ["apm-*-transaction*", "auditbeat-*", "endgame-*", "filebeat-*", "logs-*", "packetbeat-*", "traces-apm*", "winlogbeat-*", "-*elastic-cloud-logs-*"]
interval = "5m"
language = "kuery"
license = "Elastic License v2"
name = "AWS EC2 Instance User Data Modified"
note = '''
## Triage and analysis

Review the actor, source IP, user agent, request parameters, and adjacent CloudTrail activity. Confirm that the activity is expected for the responsible workload before creating a narrowly scoped exception.

'''
references = ["https://stratus-red-team.cloud/attack-techniques/AWS/aws.execution.ec2-user-data/", "https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyInstanceAttribute.html"]
risk_score = 73
rule_id = "da42c7ab-2ff4-40d0-90a0-c8a7c8e77048"
severity = "high"
tags = ["Domain: Cloud", "Data Source: AWS CloudTrail", "Use Case: Threat Detection"]
timestamp_override = "event.ingested"
type = "query"
query = '''
data_stream.dataset: "aws.cloudtrail"
  and event.provider: "ec2.amazonaws.com"
  and event.action: "ModifyInstanceAttribute"
  and event.outcome: "success"
  and aws.cloudtrail.flattened.request_parameters.userData: *
'''

[rule.investigation_fields]
field_names = [
  "@timestamp",
  "aws.cloudtrail.user_identity.arn",
  "source.ip",
  "user_agent.original",
  "event.action",
  "aws.cloudtrail.request_parameters",
  "cloud.account.id",
  "cloud.region"
]
