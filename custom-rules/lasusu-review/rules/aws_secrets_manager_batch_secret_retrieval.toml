[metadata]
creation_date = "2026/10/21"
maturity = "development"
updated_date = "2026/11/02"

[rule]
author = ["lasusu"]
description = '''
Detects five successful AWS Secrets Manager BatchGetSecretValue calls by one identity in an account during the rule interval. This complements native Elastic GetSecretValue detections without matching single-secret retrieval activity.
'''
false_positives = ["Approved applications or secret-management automation may use BatchGetSecretValue repeatedly. Add narrowly scoped exceptions for validated workload identities after establishing a benign baseline."]
from = "now-6m"
index = ["logs-aws.cloudtrail*"]
interval = "5m"
language = "kuery"
license = "Elastic License v2"
name = "AWS Secrets Manager Batch Secret Retrieval"
note = '''
## Triage and analysis

Review the actor, source IP, requested filters or secret identifiers, and adjacent CloudTrail activity. Confirm that the identity is authorized to perform repeated batch retrievals and determine how many distinct secrets may have been exposed before creating a narrowly scoped exception.

'''
references = ["https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.secretsmanager-batch-retrieve-secrets/", "https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_BatchGetSecretValue.html"]
risk_score = 73
rule_id = "1c4f425c-4fc7-4bc0-9010-a1832d093743"
severity = "high"
tags = ["Domain: Cloud", "Data Source: AWS CloudTrail", "Use Case: Threat Detection"]
timestamp_override = "event.ingested"
type = "threshold"
query = '''
data_stream.dataset: "aws.cloudtrail"
  and event.provider: "secretsmanager.amazonaws.com"
  and event.action: "BatchGetSecretValue"
  and event.outcome: "success"
'''

[rule.threshold]
field = ["cloud.account.id", "user.id"]
value = 5


[rule.investigation_fields]
field_names = [
  "@timestamp",
  "aws.cloudtrail.user_identity.arn",
  "source.ip",
  "user_agent.original",
  "event.action",
  "aws.cloudtrail.request_parameters",
  "cloud.account.id",
  "cloud.region"
]
