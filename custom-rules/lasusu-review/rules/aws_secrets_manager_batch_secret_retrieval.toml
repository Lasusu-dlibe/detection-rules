[metadata]
creation_date = "2026/10/21"
maturity = "development"
updated_date = "2026/11/02"

[rule]
author = ["lasusu"]
description = '''
Detects the first successful use of AWS Secrets Manager BatchGetSecretValue by an identity in an account within a 10-day history window. This complements native Elastic secret-retrieval volume detections and does not depend on a fixed request count, filter, or client.
'''
false_positives = ["A newly deployed application, role, or secret-management workflow may legitimately use BatchGetSecretValue for the first time. Validate the principal and workload before adding a narrowly scoped exception."]
from = "now-6m"
index = ["logs-aws.cloudtrail*"]
interval = "5m"
language = "kuery"
license = "Elastic License v2"
name = "First Time Seen AWS Batch Secret Retrieval"
note = '''
## Triage and analysis

Review the identity, source IP, user agent, and request parameters, including Filters, SecretIdList, and MaxResults. Determine whether the principal is an IAM user or an assumed role, whether it is expected to retrieve this group of secrets, and whether related GetSecretValue, ListSecrets, KMS, IAM, or discovery activity indicates credential compromise.

One BatchGetSecretValue request can retrieve multiple secrets. Treat the first use by an identity as a behavioral signal rather than proof of compromise. Validate approved application deployments and secret-management automation before creating an exception, and scope exceptions to a stable workload identity instead of an IP address alone.

'''
references = ["https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.secretsmanager-batch-retrieve-secrets/", "https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_BatchGetSecretValue.html"]
risk_score = 47
rule_id = "1c4f425c-4fc7-4bc0-9010-a1832d093743"
severity = "medium"
tags = ["Domain: Cloud", "Data Source: AWS CloudTrail", "Use Case: Threat Detection", "Rule Type: New Terms"]
timestamp_override = "event.ingested"
type = "new_terms"
query = '''
data_stream.dataset: "aws.cloudtrail"
  and event.provider: "secretsmanager.amazonaws.com"
  and event.action: "BatchGetSecretValue"
  and event.outcome: "success"
'''

[rule.new_terms]
field = "new_terms_fields"
value = ["cloud.account.id", "user.name"]

[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-10d"


[rule.investigation_fields]
field_names = [
  "@timestamp",
  "user.name",
  "aws.cloudtrail.user_identity.arn",
  "aws.cloudtrail.user_identity.type",
  "aws.cloudtrail.user_identity.access_key_id",
  "aws.cloudtrail.user_identity.session_context.session_issuer.arn",
  "source.ip",
  "user_agent.original",
  "event.action",
  "aws.cloudtrail.request_parameters",
  "cloud.account.id",
  "cloud.region"
]
