[metadata]
creation_date = "2026/10/21"
maturity = "development"
updated_date = "2026/10/21"

[rule]
author = ["lasusu"]
description = '''
Detects successful deregistration of an EC2 Amazon Machine Image. Removing an AMI can disrupt recovery, deployments, or availability.
'''
false_positives = ["Approved AMI retirement or image-pipeline cleanup may deregister images. Validate the owner and asset lifecycle before responding."]
from = "now-30m"
index = ["apm-*-transaction*", "auditbeat-*", "endgame-*", "filebeat-*", "logs-*", "packetbeat-*", "traces-apm*", "winlogbeat-*", "-*elastic-cloud-logs-*"]
interval = "5m"
language = "kuery"
license = "Elastic License v2"
name = "AWS EC2 AMI Deregistered"
note = '''
## Triage and analysis

Review the actor, source IP, user agent, request parameters, and adjacent CloudTrail activity. Confirm that the activity is expected for the responsible workload before creating a narrowly scoped exception.

'''
references = ["https://stratus-red-team.cloud/attack-techniques/AWS/aws.impact.ec2-deregister-ami/", "https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DeregisterImage.html"]
risk_score = 73
rule_id = "b966ecb3-509b-4cc3-ac45-e986d9debebe"
severity = "high"
tags = ["Domain: Cloud", "Data Source: AWS CloudTrail", "Use Case: Threat Detection"]
timestamp_override = "event.ingested"
type = "query"
query = '''
data_stream.dataset: "aws.cloudtrail"
  and event.provider: "ec2.amazonaws.com"
  and event.action: "DeregisterImage"
  and event.outcome: "success"
'''

[rule.investigation_fields]
field_names = [
  "@timestamp",
  "aws.cloudtrail.user_identity.arn",
  "source.ip",
  "user_agent.original",
  "event.action",
  "aws.cloudtrail.request_parameters",
  "cloud.account.id",
  "cloud.region"
]
